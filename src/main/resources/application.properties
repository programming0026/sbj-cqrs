spring.application.name=sbj-cqrs
server.port=8080

# LADO DE ESCRITURA: PostgreSQL (docker compose up -d)
app.datasource.write.jdbc-url=${WRITE_DB_URL:jdbc:postgresql://localhost:5433/cqrs_write}
app.datasource.write.username=${WRITE_DB_USER:cqrs}
app.datasource.write.password=${WRITE_DB_PASSWORD:cqrs}

# LADO DE LECTURA: MySQL (docker compose up -d)
app.datasource.read.jdbc-url=${READ_DB_URL:jdbc:mysql://localhost:3307/cqrs_read?connectionTimeZone=UTC}
app.datasource.read.username=${READ_DB_USER:cqrs}
app.datasource.read.password=${READ_DB_PASSWORD:cqrs}

# Proyector: cada cuánto sincroniza las vistas de lectura y cuántos eventos procesa por tanda
cqrs.projection-delay-ms=500
cqrs.batch-size=100
